<style>
  :root {
    --bg: #f5f6f8;
    --ink: #1f2933;
    --head: #2c3e50;
    --link: #1e5096;
    --muted: #5f6973;
    --rule: #d8dde3;
    --card: #ffffff;
    --btn-bg: #2c3e50;
    --btn-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13171c;
      --ink: #e3e7eb;
      --head: #eef2f6;
      --link: #8fb5ee;
      --muted: #9aa5b1;
      --rule: #2d343d;
      --card: #1b2027;
      --btn-bg: #dfe6ee;
      --btn-ink: #13171c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 44px 16px 48px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: 0.04em; color: var(--head); text-transform: uppercase; }
  .role { margin: 6px 0 0; font-size: 1.1rem; }
  .contact { margin: 8px 0 0; color: var(--muted); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .actions { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-weight: 600; }
  .btn:hover { text-decoration: none; }
  .primary { background: var(--btn-bg); color: var(--btn-ink); }
  .secondary { border: 1px solid var(--rule); }
  .viewer { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .viewer object { display: block; width: 100%; height: 88vh; min-height: 640px; }
  .fallback { margin: 0; padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    main { padding-top: 32px; }
    h1 { font-size: 1.6rem; }
    .viewer { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Volodymyr Polishchuk</h1>
    <p class="role">Head of Software &amp; Autonomy · Systems Architect · GPS-Denied UAV Navigation</p>
    <p class="contact">Kyiv, Ukraine · <a href="mailto:v.s.polishchuk@proton.me">v.s.polishchuk@proton.me</a></p>
    <div class="actions">
      <a class="btn primary" href="cv.pdf">Open CV (PDF)</a>
      <a class="btn secondary" href="cv.pdf" download="Volodymyr-Polishchuk-CV.pdf">Download</a>
    </div>
  </header>
  <div class="viewer">
    <object data="cv.pdf#view=FitH" type="application/pdf" aria-label="CV">
      <p class="fallback">This browser can't show the PDF inline. <a href="cv.pdf">Open the CV</a>.</p>
    </object>
  </div>
</main>
</body>
</html>
